{{define "content"}}
<h1>{{.Title}}</h1>
{{if .Registered}}<p class="success">注册完成，请登录查看会员内容。</p>{{end}}
{{if .Error}}<p class="error" role="alert">{{.Error}}</p>{{end}}
<form class="auth" method="post" action="{{.Action}}">
  {{if eq .Action "/register"}}<label>姓名<input name="name" autocomplete="name" value="{{.Values.Get "name"}}" required></label>{{end}}
  <label>邮箱<input type="email" name="email" autocomplete="email" value="{{.Values.Get "email"}}" required></label>
  <label>密码<input type="password" name="password" autocomplete="current-password" minlength="8" required></label>
  <button type="submit">{{.Title}}</button>
</form>
{{end}}
